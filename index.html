<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSIS 公民服務入口網</title>
    <style>
        :root { --primary: #003366; --bg: #f4f6f8; --text: #333; --border: #ddd; --danger: #cc0000; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .broadcast-banner { display: none; width: 100%; max-width: 600px; background: #fff3cd; color: #856404; padding: 12px; margin-bottom: 20px; border-left: 4px solid #ffeeba; border-radius: 4px; font-weight: bold; font-size: 0.95rem; }
        .card { background: #fff; width: 100%; max-width: 600px; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #666; font-weight: bold; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); margin-bottom: -2px; }
        .content { display: none; }
        .content.active { display: block; }
        .data-grid { display: grid; grid-template-columns: 120px 1fr; gap: 12px; font-size: 1rem; }
        .label { color: #666; text-align: right; font-weight: bold; }
        .val { font-weight: 500; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--primary); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        button:hover { background: #002244; }
        .warning-text { color: var(--danger); font-size: 0.85rem; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="broadcast" class="broadcast-banner"></div>

    <div class="card">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('info')">身分查詢</div>
            <div class="tab" onclick="switchTab('apply')">申領服務</div>
            <div class="tab" onclick="switchTab('update')">更新資料</div>
        </div>

        <!-- 查詢身分 -->
        <div id="info" class="content active">
            <input type="text" id="q-card" placeholder="請輸入實體憑證號碼 (10碼)">
            <button onclick="queryInfo()">查詢資料</button>
            <div id="info-result" class="data-grid" style="margin-top: 25px; display: none;">
                <div class="label">智能編號</div><div class="val" id="r-smart">--</div>
                <div class="label">登記姓名</div><div class="val" id="r-name">--</div>
                <div class="label">性別</div><div class="val" id="r-gender">--</div>
                <div class="label">出生日期</div><div class="val" id="r-dob">--</div>
                <div class="label">聯絡電話</div><div class="val" id="r-phone">--</div>
                <div class="label">登記地區</div><div class="val" id="r-region">--</div>
            </div>
        </div>

        <!-- 申領服務 (不再需要照片) -->
        <div id="apply" class="content">
            <select id="a-type"><option value="NEW">首辦新證</option><option value="REPLACE">換領憑證 (遺失/損壞)</option></select>
            <input type="text" id="a-old" placeholder="舊智能編號 (首辦免填)">
            <input type="text" id="a-name" placeholder="真實姓名">
            <input type="date" id="a-dob">
            <select id="a-gender"><option value="男">男</option><option value="女">女</option></select>
            <input type="text" id="a-phone" placeholder="聯絡電話">
            <input type="text" id="a-region" placeholder="居住地區">
            <button onclick="submitApplication()">提交申請</button>
        </div>

        <!-- 自動更新資料 (無須審核) -->
        <div id="update" class="content">
            <div class="warning-text">※ 身份驗證：請輸入憑證資訊以核實身分</div>
            <input type="text" id="u-card" placeholder="實體憑證號碼 (10碼)">
            <input type="text" id="u-smart" placeholder="智能編號">
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            <div class="warning-text">※ 僅允許更改聯絡電話與居住地區</div>
            <input type="text" id="u-phone" placeholder="新聯絡電話">
            <input type="text" id="u-region" placeholder="新居住地區">
            <button onclick="updateData()">確認並提交更改</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD42CHramMOT5yu6d0WhkMFs_5ZwQiPvPI",
            authDomain: "ks11-a4274.firebaseapp.com",
            databaseURL: "https://ks11-a4274-default-rtdb.firebaseio.com",
            projectId: "ks11-a4274",
            storageBucket: "ks11-a4274.firebasestorage.app",
            messagingSenderId: "383409057129",
            appId: "1:383409057129:web:3b5b6a389e523dddaee1f8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function switchTab(id) {
            document.querySelectorAll('.content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }

        // 監聽後台廣播
        db.ref('/settings/broadcast').on('value', snap => {
            const data = snap.val();
            const banner = document.getElementById('broadcast');
            if (data && data.message) {
                banner.innerText = `【系統廣播】${data.message}`;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        });

        async function queryInfo() {
            const card = document.getElementById('q-card').value.trim();
            const snap = await db.ref(`/identities/${card}`).once('value');
            if (!snap.exists()) return alert("查無此憑證資料。");
            const d = snap.val();
            document.getElementById('r-smart').innerText = d.smart_code;
            document.getElementById('r-name').innerText = d.name;
            document.getElementById('r-gender').innerText = d.gender;
            document.getElementById('r-dob').innerText = d.dob;
            document.getElementById('r-phone').innerText = d.phone || '--';
            document.getElementById('r-region').innerText = d.region;
            document.getElementById('info-result').style.display = 'grid';
        }

        async function submitApplication() {
            const data = {
                id: Date.now().toString(),
                type: document.getElementById('a-type').value,
                oldCardId: document.getElementById('a-old').value.trim(),
                name: document.getElementById('a-name').value.trim(),
                dob: document.getElementById('a-dob').value,
                gender: document.getElementById('a-gender').value,
                phone: document.getElementById('a-phone').value.trim(),
                region: document.getElementById('a-region').value.trim(),
                status: 'PENDING',
                timestamp: Date.now()
            };
            if (!data.name || !data.dob || !data.phone || !data.region) return alert("請填寫所有必要欄位。");
            await db.ref(`/applications/${data.id}`).set(data);
            alert("申請已提交，請靜候處理。");
            ['a-old','a-name','a-dob','a-phone','a-region'].forEach(id => document.getElementById(id).value = '');
        }

        async function updateData() {
            const card = document.getElementById('u-card').value.trim();
            const smart = document.getElementById('u-smart').value.trim();
            const newPhone = document.getElementById('u-phone').value.trim();
            const newRegion = document.getElementById('u-region').value.trim();

            if (!card || !smart || !newPhone || !newRegion) return alert("請填寫所有欄位。");
            
            const snap = await db.ref(`/identities/${card}`).once('value');
            if (!snap.exists() || snap.val().smart_code !== smart) {
                return alert("身分驗證失敗：實體憑證號碼或智能編號錯誤。");
            }

            const warnMsg = "【法律警告】\n根據《人事登記條例》，向登記主任提供虛假資料即屬犯罪，違者最高可被判處罰款及監禁。\n\n請問您確認所填寫的新聯絡電話與居住地區皆為真實無誤，並同意直接更新至系統庫嗎？";
            if (confirm(warnMsg)) {
                await db.ref(`/identities/${card}`).update({ phone: newPhone, region: newRegion });
                alert("資料已成功更新。");
                ['u-card','u-smart','u-phone','u-region'].forEach(id => document.getElementById(id).value = '');
            }
        }
    </script>
</body>
</html>
